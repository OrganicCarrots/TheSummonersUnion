name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 (the version WoW uses)
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Run the offline test suite
        run: lua5.1 tests/run.lua
